services:
  app:
    build: .
    image: stockflow:local
    environment:
      STOCKFLOW_DB: /data/stockflow.sqlite
      STOCKFLOW_AUTOSEED: "1"
      # 退货原单晚到策略：provisional（默认，临时入账保在库）/ wait_original（隔离等原单）
      RETURN_POLICY: provisional
      TZ: Asia/Shanghai
    ports:
      - "18207:8000"
    volumes:
      - stockflow-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/api/health', timeout=2.0)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

volumes:
  stockflow-data:
